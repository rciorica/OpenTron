version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: opentron-postgres
    environment:
      POSTGRES_DB: opentron
      POSTGRES_USER: opentron
      POSTGRES_PASSWORD: opentron_secure_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - opentron-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opentron -d opentron"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:

networks:
  opentron-network:
    driver: bridge
